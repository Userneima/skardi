<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="365" viewBox="60 40 1320 342" role="img" aria-labelledby="t d">
<title id="t">Skardi governed context for coding agents</title>
<desc id="d">已连接的数据源和上下文定义经过 Skardi 治理，为编程 Agent 提供受控的只读上下文和已批准访问。</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f4fbf8"/></linearGradient>
<linearGradient id="skardi" x1="0" x2="1"><stop stop-color="#2ec47a"/><stop offset="1" stop-color="#1a8fe0"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="11" stdDeviation="15" flood-color="#29445b" flood-opacity=".12"/></filter>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2ec47a"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1a8fe0"/></marker>
</defs>
<!-- top column labels (CocoIndex-style) -->
<g font-family="Inter, Arial, sans-serif" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="3">
<text x="232" y="56" fill="#168056">你的输入</text>
<text x="690" y="56" fill="#1a8fe0">SKARDI · 治理</text>
<text x="1175" y="56" fill="#1a8fe0">AGENT · 只读</text>
</g>

<path d="M428 214 C 510 210 552 182 626 166" fill="none" stroke="#2ec47a" stroke-width="3.5" stroke-dasharray="9 10" marker-end="url(#ag)"/>
<path d="M754 166 C 834 182 882 210 972 214" fill="none" stroke="#1a8fe0" stroke-width="3.5" stroke-dasharray="9 10" marker-end="url(#ab)"/>

<!-- LEFT -->
<g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
<rect x="62" y="92" width="366" height="248" rx="18" fill="#ffffff" stroke="#2ec47a" stroke-opacity=".58"/>
<rect x="88" y="118" width="314" height="90" rx="12" fill="#f2fbf7" stroke="#2ec47a" stroke-opacity=".32"/>
<g transform="translate(104 148) scale(1)" fill="none" stroke="#168056" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
<text x="150" y="157" fill="#172b3a" font-size="22" font-weight="700">已连接的数据源</text>
<text x="150" y="183" fill="#607486" font-size="16">数据库 · SaaS · 文件</text>
<rect x="88" y="224" width="314" height="90" rx="12" fill="#f2fbf7" stroke="#2ec47a" stroke-opacity=".32"/>
<g transform="translate(104 254) scale(1)" fill="none" stroke="#168056" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h.01"/><path d="M3 12h.01"/><path d="M3 19h.01"/><path d="M8 5h13"/><path d="M8 12h13"/><path d="M8 19h13"/></g>
<text x="150" y="263" fill="#172b3a" font-size="22" font-weight="700">上下文定义</text>
<text x="150" y="289" fill="#607486" font-size="16">数据含义 + Agent 范围</text>
</g>

<!-- CENTER logo hub -->
<image href="data:image/png;base64," x="636" y="88" width="108" height="108"/>
<g font-family="Inter, Arial, sans-serif" text-anchor="middle">
<text x="690" y="284" fill="url(#skardi)" font-size="46" font-weight="800">Skardi</text>
<text x="690" y="314" fill="#607486" font-size="17">数据源 · 含义 · 范围</text>
<text x="690" y="342" fill="#168056" font-size="17">一个受治理的 Agent 上下文</text>
</g>

<!-- RIGHT -->
<g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
<rect x="972" y="80" width="406" height="300" rx="18" fill="#ffffff" stroke="#1a8fe0" stroke-opacity=".68"/>
<rect x="972" y="80" width="406" height="60" rx="18" fill="#edf7fe"/>
<path d="M972 140h406" stroke="#1a8fe0" stroke-opacity=".28"/>
<g transform="translate(998 97) scale(0.95)" fill="none" stroke="#1a8fe0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></g>
<text x="1036" y="119" fill="#172b3a" font-size="23" font-weight="700">编程 Agent</text>
<text x="1000" y="180" fill="#607486" font-size="14" font-weight="700" letter-spacing="1">面向 AGENT 的上下文</text>
<text x="1000" y="216" fill="#172b3a" font-size="18" font-weight="700">相关数据、含义和已批准范围</text>
<text x="1000" y="262" fill="#607486" font-size="14" font-weight="700" letter-spacing="1">安全边界</text>
<rect x="1000" y="278" width="160" height="36" rx="8" fill="#f2fbf7" stroke="#2ec47a" stroke-opacity=".6"/>
<text x="1080" y="302" text-anchor="middle" fill="#168056" font-size="16" font-family="JetBrains Mono, monospace">只读</text>
<rect x="1174" y="278" width="186" height="36" rx="8" fill="#edf7fe" stroke="#1a8fe0" stroke-opacity=".6"/>
<text x="1267" y="302" text-anchor="middle" fill="#1a8fe0" font-size="16" font-family="JetBrains Mono, monospace">已批准访问</text>
<text x="1000" y="356" fill="#168056" font-size="16" font-family="JetBrains Mono, monospace">不允许写入或更改 Schema</text>
</g>

</svg>
